# =============================================================================
# Apache hardening untuk RCE PHP
#
#   CVE-2026-109618 (RCE via OOM corruption)  : OOM saat request startup
#   CVE-2026-109619 (RCE via stale global state): state global antar-request
#   CVE-2026-29014 (MetInfo PHP injection)      : file .php ditulis ke disk
#
# Car pasang (Debian/Ubuntu):
#   a2enmod headers && a2enmod security2
#   cp defense/apache-hardening.conf /etc/apache2/conf-available/php-rce-hardening.conf
#   a2enconf php-rce-hardening && apachectl configtest && systemctl reload apache2
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Batasi ukuran request di layer Apache (SEBELUM body masuk ke PHP)
#    Advisory: "Keep post_max_size conservative and independently enforce the
#    decoded request size at the frontend."
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    # Batas per-request body (harus >= post_max_size PHP).
    LimitRequestBody 16777216

    # Jangan pernah izinkan Transfer-Encoding chunked pada endpoint yang
    # tidak butuh: membuat Content-LengthChecks dilewati.
    RequestHeader unset Transfer-Encoding early
</IfModule>

# ---------------------------------------------------------------------------
# 2. Header yang dipakai eksploit dibuang
#    - "C" : transport payload pada exploit MetInfo (CVE-2026-29014)
#    - header non-standar umum untuk smuggling payload
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    RequestHeader unset C early
    RequestHeader unset C2 early
    RequestHeader unset Cmd early
    RequestHeader unset Payload early
    RequestHeader unset X-Cmd early
</IfModule>

# ---------------------------------------------------------------------------
# 3. Batasi jumlah header request (applies ke HTTP headers, bukan part header)
# ---------------------------------------------------------------------------
<IfModule core.c>
    # Header HTTP yang mencurigakan dari aplikasi yang mencoba smuggling.
    <IfModule mod_headers.c>
        Header always unset X-Powered-By
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</IfModule>

# ---------------------------------------------------------------------------
# 4. PHP: matikan engine untuk direktori yang tidak boleh dieksekusi
#    (cache/, upload/, tmp/) - kunci pertama terhadap "file .php ditulis disk"
# ---------------------------------------------------------------------------
<DirectoryMatch "^/var/www/.*/(cache|upload|uploads|tmp|temp|data|files)/">
    <IfModule mod_php.c>
        php_admin_flag engine Off
    </IfModule>
    <IfModule mod_php7.c>
        php_admin_flag engine Off
    </IfModule>
    <IfModule mod_php8.c>
        php_admin_flag engine Off
    </IfModule>
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar
    <FilesMatch "\.(?i:ph(?:p[0-9.]*|ar|tml|ps|t)|inc|hphp|ctp)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# ---------------------------------------------------------------------------
# 5. Nonaktifkan PHP handler di direktori cache MetInfo secara spesifik
#    (path traversal menulis cache/weixin/Array.php -> tidak boleh dieksekusi)
# ---------------------------------------------------------------------------
<DirectoryMatch "/metinfo/.*/cache/">
    <IfModule mod_php.c>
        php_admin_flag engine Off
    </IfModule>
    <IfModule mod_php8.c>
        php_admin_flag engine Off
    </IfModule>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# ---------------------------------------------------------------------------
# 6. Jangan tampilkan isi direktori
# ---------------------------------------------------------------------------
<IfModule mod_autoindex.c>
    Options -Indexes
</IfModule>

# ---------------------------------------------------------------------------
# 7. ServerTokens minimal (kurangi informasi yang dibocorkan)
# ---------------------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
