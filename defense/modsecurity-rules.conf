# =============================================================================
# ModSecurity / OWASP CRS - aturan defensif untuk RCE PHP
#
# Target utama:
#   1. CVE-2026-29014 (MetInfo unauthenticated PHP code injection)
#   2. CVE-2026-109618 (PHP RCE via OOM corruption, multipart header flood)
#   3. CVE-2026-109619 (PHP RCE via stale global state)
#
# Cara pasang (Debian/Ubuntu dengan libapache2-mod-security2):
#   cp defense/modsecurity-rules.conf /etc/modsecurity/owasp-crs/custom-rules-before-crs.conf
#   a2enmod security2 && systemctl reload apache2
#
# Uji tanpa mengganggu produksi:
#   apachectl -t && apachectl -S
#
# CATATAN: ini adalah lapisan deteksi/d mitigasi, bukan pengganti patch.
#   CVE-2026-109618/109619 hanya bisa dimitigasi penuh dengan upgrade PHP.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. CVE-2026-29014 - MetInfo cache write / path traversal / ${...} injection
# -----------------------------------------------------------------------------

# 1a. Path traversal pada parameter-weixin (EventKey / adminlogin&../config/...)
SecRule REQUEST_URI "@rx (?i)adminlogin" \
    "id:1001001,\
    phase:1,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - akses endpoint weixin doapi tanpa autentikasi',\
    tag:'attack-reputation/lfi',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL',\
    setvar:'tx.metinfo_cve_2026_29014=1'"

# 1b. Percobaan traversal direktori di body (payload FromUserName / parameter lain)
SecRule ARGS_POST "@rx (?:\.\./|%2e%2e[/\\]|%252e%252e)" \
    "id:1001002,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - path traversal pada body',\
    tag:'attack-reconstruction/lfi',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?:\.\./|%2e%2e[/\\]|%252e%252e)" \
    "id:1001003,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - path traversal pada request body',\
    tag:'attack-reconstruction/lfi',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

# 1c. Interpolasi complex-curly syntax PHP di dalam body (payload inti RCE)
#     Pola: ${...}   contoh: {${eval(base64_decode($_SERVER[...]))}}.${die()}}
SecRule REQUEST_BODY "@rx \$\{[^\}]{1,400}\}" \
    "id:1001004,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - PHP complex curly interpolation di body',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule ARGS_POST "@rx \$\{[^\}]{1,400}\}" \
    "id:1001005,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - PHP complex curly interpolation di parameter',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

# 1d. Rantai fungsi berbahaya di body: eval + base64_decode, chr() berantai,
#     gzinflate/gzdecode, assert, create_function, system+passthru+shell_exec.
SecRule REQUEST_BODY "@rx (?i)\b(eval|assert|create_function|preg_replace\s*\(\s*['\"]/[^'\"]*e['\"]|system|passthru|shell_exec|popen|proc_open)\b" \
    "id:1001006,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - fungsi eksekusi PHP di request body',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?i)base64_decode\s*\(\s*['\"]?[A-Za-z0-9+/]{40,}={0,2}" \
    "id:1001007,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - base64 blob di request body',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?i)(chr\s*\(\s*\d+\s*\)\s*\.\s*){6,}" \
    "id:1001008,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - rantai chr() di request body',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?i)(gzinflate|gzuncompress|gzdecode)\s*\(" \
    "id:1001009,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - dekompresi payload di request body',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

# 1e. Header transporting payload (eksploit kita memakai header "C:")
SecRule REQUEST_HEADERS:C "@rx (?i)^[A-Za-z0-9+/]{40,}={0,2}$" \
    "id:1001010,\
    phase:1,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - header base64 (transport payload)',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

SecRule REQUEST_HEADERS ":(C|C2|cmd|payload|x-cmd)$" \
    "id:1001011,\
    phase:1,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - header transport payload generik',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

# 1f. File cache MetInfo yang ditulis penyerang (IOC di filesystem, bukan HTTP)
#     -> aturan ini untuk request yang menyentuh file cache hasil injeksi.
SecRule REQUEST_URI "@rx (?i)/cache/(weixin|config)/[A-Za-z0-9_]+\.php" \
    "id:1001012,\
    phase:1,\
    deny,status:403,log,\
    msg:'CVE-2026-29014 MetInfo - akses file cache .php',\
    tag:'attack-reconstruction/lfi',\
    tag:'cve/CVE-2026-29014',\
    severity:'CRITICAL'"

# -----------------------------------------------------------------------------
# 2. CVE-2026-109618 - multipart header flood / OOM saat request startup
# -----------------------------------------------------------------------------

# 2a. Batasi jumlah header di dalam satu part multipart.
#     SecRule bekerja pada REQUEST_BODY; untuk batas jumlah header yang akurat
#     lebih baik pakai mod_security + rule engine SecRequestBodyAccess On
#     (body dicache). Ambil 1 body per part = >N header -> deny.
SecRule REQUEST_BODY "@rx (?:\r\n[A-Za-z0-9\-]{1,64}:[^\r\n]{0,200}\r\n){200,}" \
    "id:1002001,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-109618 PHP - Excessive multipart part headers (memory amplification)',\
    tag:'attack-dos/resource-consumption',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 2b. Jumlah part multipart yang banyak (termasuk file control kosong yang
#     tidak dihitung max_file_uploads).
SecRule REQUEST_BODY "@rx (?:Content-Disposition:\s*form-data;){200,}" \
    "id:1002002,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-109618 PHP - Excessive multipart parts',\
    tag:'attack-dos/resource-consumption',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 2c. Nama field bersarang (nested) yang memperbesar pekerjaan array (array work).
SecRule REQUEST_BODY "@rx (?:\[[^\]\r\n]{1,64}\]){50,}" \
    "id:1002003,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-109618 PHP - Excessive input nesting',\
    tag:'attack-dos/resource-consumption',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 2d. Multipart yang memuat banyak file control kosong.
SecRule REQUEST_BODY "@rx (?i)filename=\"\"" \
    "chain,\
    phase:2,\
    deny,status:403,log,\
    msg:'CVE-2026-109618 PHP - Empty file controls flood',\
    tag:'attack-dos/resource-consumption',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"
    SecRule REQUEST_BODY "@rx (?i)(?:Content-Disposition:\s*form-data;){100,}"

# -----------------------------------------------------------------------------
# 3. CVE-2026-109619 - stale global state
# -----------------------------------------------------------------------------
# Tidak ada signature HTTP yang andal: bug ini adalah use-after-free antar-request.
# Yang bisa dilakukan di layer WAF hanya rate limiting + logging agresif agar
# request yang memicu fatal error/OOM terlihat. Lihat defense/README.md.
SecRule REQUEST_URI "@rx (?i)/upload" \
    "id:1003001,\
    phase:1,\
    pass,nolog,\
    ctl:requestBodyAccess=On,\
    msg:'CVE-2026-109619 - jalur upload dipantau'"

# -----------------------------------------------------------------------------
# 4. Aturan umum tambahan (multi-CVE)
# -----------------------------------------------------------------------------
SecRule REQUEST_BODY "@rx (?i)(?:/bin/(?:ba)?sh|/proc/self/environ|whoami|id\s*;)" \
    "id:1004001,\
    phase:2,\
    deny,status:403,log,\
    msg:'Umum - signature perintah shell di request body',\
    tag:'attack-injection/shell',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?i)\$_SERVER\s*\[\s*['\"]HTTP_" \
    "id:1004002,\
    phase:2,\
    deny,status:403,log,\
    msg:'Umum - akses \$_SERVER header di request body (payload eval)',\
    tag:'attack-injection/php',\
    severity:'CRITICAL'"

SecRule REQUEST_BODY "@rx (?i)(?:/etc/passwd|/proc/\d+/cmdline)" \
    "id:1004003,\
    phase:2,\
    deny,status:403,log,\
    msg:'Umum - path OS sensitif di request body',\
    tag:'attack-lfi',\
    severity:'CRITICAL'"

# ---------------------------------------------------------------------------
# 5. Rate limit (mitigasi DoS / kecepatan brute-force exploit)
# ---------------------------------------------------------------------------
SecRule REQUEST_URI "@rx (?i)adminlogin" \
    "id:1005001,\
    phase:1,\
    pass,nolog,\
    setvar:'tx.exploit_rate=+%{tx.exploit_rate}'"

SecRule TX:EXPLOIT_RATE "@gt 10" \
    "id:1005002,\
    phase:1,\
    deny,status:429,log,\
    msg:'Rate limit percobaan exploit MetInfo',\
    tag:'attack-reputation/lfi'"

# ---------------------------------------------------------------------------
# 6. Rantai php2shell (session.upload_progress) - CVE-2026-109618/109619
# ---------------------------------------------------------------------------
# Rantai A/B/C/D semuanya menaruh payload di dalam body multipart, di salah
# satu dari dua tempat:
#   (1) atribut  filename="..."   pada header Content-Disposition
#   (2) nilai field PHP_SESSION_UPLOAD_PROGRESS
# Payload (1) dan (2) berakhir di file session sebagai TEKS. Kalau file
# session itu pernah di-include sebagai PHP, payload tereksekusi.
#
# Aturan di bawah mendeteksi pola yang dipakai payload lab ini. Ini
# DETEKSI, bukan pengganti session.upload_progress.enabled=0.

# 6a. filename multipart yang memuat tag PHP.
#     Pola payload Chain A/E: filename="<?php ... ?>"
SecRule REQUEST_BODY "@rx (?i)filename\s*=\s*\"[^\"]*<\?php" \
    "id:1006001,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - PHP code in multipart filename attribute (session upload_progress)',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 6b. filename multipart yang memuat marker unserialize / marker internal
#     function PHP (dipakai Chain C/E untuk menimpa handler internal function).
SecRule REQUEST_BODY "@rx (?i)filename\s*=\s*\"[^\"]*(?:zend_internal_function|function_table|executor_globals)" \
    "id:1006002,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - internal PHP symbol in multipart filename attribute',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 6c. Field PHP_SESSION_UPLOAD_PROGRESS yang isinya bukan identifier
#     sederhana. Nilai normal dari klien web = satu token acak (hex/hex).
#     Nilai yang mengandung '|' + serialized blob = payload.
SecRule REQUEST_BODY "@rx (?i)name\s*=\s*\"PHP_SESSION_UPLOAD_PROGRESS\"[^\r\n]*\r\n\r\n[^\r\n]{0,4096}\|" \
    "id:1006003,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - serialized blob in PHP_SESSION_UPLOAD_PROGRESS field',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-109619',\
    severity:'CRITICAL'"

# 6d. Nilai field PHP_SESSION_UPLOAD_PROGRESS yang memuat tag PHP / marker
#     unserialize (vektor 'key' milik Chain A/E).
SecRule REQUEST_BODY "@rx (?i)name\s*=\s*\"PHP_SESSION_UPLOAD_PROGRESS\"[^\r\n]*\r\n\r\n[^\r\n]{0,8192}(?:<\?php|O:\d+:\"[A-Za-z_]+\":\d+:\{|base64_decode)" \
    "id:1006004,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - PHP/serialized payload in PHP_SESSION_UPLOAD_PROGRESS field',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-109619',\
    severity:'CRITICAL'"

# 6e. File session yang tries to be included sebagai PHP.
#     Pola: parameter page=/.../sess_<id>  (Chain A/D memakai sink LFI
#     dengan nama file session sebagai path).
SecRule ARGS "@rx (?i)(?:^|/)sess_[A-Za-z0-9,\-]{1,64}$" \
    "id:1006005,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - akses langsung ke file session PHP (LFI)',\
    tag:'attack-lfi',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"

# 6f. Data session yang sudah tertanam payload PHP (state bocor).
#     Pola: key progress "upload_progress_<nilai>" berisi serialized blob
#     yang memuat tag PHP -> bukti file session sudah tercemar.
SecRule REQUEST_BODY "@rx (?i)(?:upload_progress_[^|\r\n]{1,4096}\|[^\r\n]{0,4096}s:\d+:\"[^\"]*<\?php)" \
    "id:1006006,\
    phase:2,\
    deny,status:403,log,\
    msg:'php2shell - payload PHP tertanam di data session',\
    tag:'attack-injection/php',\
    tag:'cve/CVE-2026-109618',\
    severity:'CRITICAL'"
