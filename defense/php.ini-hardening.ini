; =============================================================================
; php.ini hardening untuk server yang terdampak
;   CVE-2026-109618 (RCE via OOM corruption)   -> wajib upgrade PHP
;   CVE-2026-109619 (RCE via stale global state) -> wajib upgrade PHP
;   CVE-2026-29014 (MetInfo unauthenticated PHP injection) -> patch aplikasi
;
; Car pasang:
;   cp defense/php.ini-hardening.ini /etc/php/8.4/apache2/conf.d/99-hardening.ini
;   systemctl restart apache2
;
; Peringatan penting
;   memory_limit=-1 di bawah ini adalah MITIGASI SEMENTARA yang konsisten
;   dengan advisory GHSA-w8hw-w9fx-j79w (bagian "Mitigation"), bukan solusi
;   final. Mitigasi ini TIDAK mencegah heap corruption dari mmap() failure.
;   Setelah PHP >= 8.4.27 terpasang, kembalikan memory_limit ke nilai finite.
; =============================================================================

; --- 1. Batas memori (mitigasi sementara CVE-2026-109618) --------------------
; Advisory: "setting and enforcing memory_limit=-1 administratively is the
; primary configuration mitigation. It removes the predictable per-request
; limit that enables the confirmed exploit with a controllable OOM."
; NOLIMIT dipakai HANYA selama window upgrade. Jangan pakai RLIMIT_AS /
; RLIMIT_DATA (advisory secara eksplisit menyatakan jangan).
memory_limit = -1

; --- 2. Batas ukuran request & nesting -------------------------------------
; post_max_size sengaja konservatif: batas ini dicek sebelum body diparse.
post_max_size = 16M
upload_max_filesize = 16M

; Kurangi jumlah variabel input, file, dan kedalaman nesting.
; Header per-part multipart tidak punya limit bawaan -> batasi lewat WAF.
max_input_vars = 1000
max_file_uploads = 20
max_input_nesting_level = 16

; --- 3. Matikan fitur upload progress (mitigasi CVE-2026-109619) -----------
; Session upload progress bisa menyentuh state session sebelum inisialisasi
; normal request -> jalur "consumer" pada GHSA-6wmf-4rv5-p3rp.
; Advisori: "It might be prudent to set session.upload_progress.enabled=0 if
; you don't need this feature even after applying the patch".
;
; PENTING (hasil empiris lab exploit/php2shell): mematikan fitur ini
; menutup SEMUA rantai yang relies pada upload_progress:
;   A  upload_progress -> file session -> LFI  -> RCE pre-auth
;   B  UAF var_destroy() (use-after-free)       -> worker mati
;   C  handler mismatch -> __destruct           -> RCE pre-auth
;   D  OOM startup -> state session basi        -> RCE lintas request
; Upgrade PHP ke >= 8.4.27 HANYA menutup rantai D. Mitigasi ini yang
; menutup A/B/C.
session.upload_progress.enabled = 0

; Cleanup = On (default upstream): data progress dihapus begitu upload selesai.
; Jangan diubah ke Off -- sisa progress di file session justru kondisi
; "state bocor" yang dipakai rantai D (consumer membaca file session lama).
; Catatan: ini hanya relevan kalau upload_progress diaktifkan lagi; selama
; enabled=0 fiturnya mati total.
session.upload_progress.cleanup = On
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Seragamkan session.serialize_handler di semua direktori/vhost/path.
; Handler mismatch (producer pakai php_serialize, consumer pakai php) adalah
; prasyarat Chain C. Kalau seluruh aplikasi memakai handler yang sama,
; rantai ini tidak bisa dirangkai.
session.serialize_handler = php

; --- 4. Matikan backtrace fatal error (mitigasi CVE-2026-109619, PHP 8.5) ---
; Di PHP 8.5, fatal_error_backtraces=1 adalah "producer" yang terkonfirmasi.
; Di 8.4 direktif ini tidak ada (diabaikan) tapi aman untuk dipasang.
fatal_error_backtraces = 0

; --- 5. Fungsi & kelas berbahaya -------------------------------------------
; Menonaktifkan fungsi eksekusi perintah mengurangi dampak bila ada RCE
; (defense in depth, bukan pengganti patch).
;
; CATATAN PENTING: disable_functions TIDAK menutup rantai php2shell yang
; berbasis session.upload_progress (A/B/C/D). Yang ditutup hanya konsekuensi
; command-execution biasa. Untuk menutup rantai-rantai itu tetap perlu
; session.upload_progress.enabled = 0 (bagian 3) + upgrade PHP (bagian 0).
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,dl
disable_classes = ReflectionFunction,ReflectionMethod,ReflectionClass

; FFI: default upstream adalah "preload" (hanya boleh dipanggil dari file
; preload, TIDAK dari script request). Memaksa "preload" memastikan tidak ada
; kode request yang bisa memanggil FFI::cdef() -> FFI::load() -> pointer
; mentah ke libc. "1" (dipakai instance lab untuk Chain E) membuka
; write-arbitrer ke memori proses dari dalam script.
;
; Kalau aplikasi Anda memang butuh FFI, gunakan "preload" dan load library
; hanya dari file preload yang Anda review.
ffi.enable = preload

; --- 6. Konfigurasi file include --------------------------------------------
allow_url_include = Off
allow_url_fopen = On
; Hanya isi jika aplikasi tidak butuh; gunakan open_basedir yang benar-benar
; validated untuk aplikasi Anda, contoh:
; open_basedir = /var/www/html:/tmp:/var/lib/php/sessions
; open_basedir = /var/www/html

; --- 7. Logging & error handling -------------------------------------------
; Advisory GHSA-6wmf-4rv5-p3rp: "Enable log_errors=On, a functional error_log,
; and error_reporting=E_ALL in startup configuration during an isolated audit."
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors_max_len = 0

; --- 8. Hardening umum -----------------------------------------------------
expose_php = Off
allow_call_time_pass_reference = Off
zend.assertions = -1
assert.active = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
default_charset = "UTF-8"
